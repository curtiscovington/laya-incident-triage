name: Verify published study
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-analysis.txt
      - name: Install analysis dependencies (no model weights)
        run: python -m pip install -r requirements-analysis.txt
      - name: Test harness and study statistics
        run: |
          python -m unittest -v
          python -m unittest discover -s study -p 'test_*.py' -v
      - name: Reproduce and verify published analysis
        run: |
          python study/run.py audit
          python study/run.py analyze
          python study/render_figures.py
          python study/verify_results.py
